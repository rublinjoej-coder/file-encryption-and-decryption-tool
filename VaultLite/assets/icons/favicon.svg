<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6" />
            <stop offset="50%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>
        <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#c4b5fd" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Background Circle -->
    <rect width="64" height="64" rx="16" fill="#070b14" />
    <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5" />
    
    <!-- Shield Outer -->
    <path d="M32 9 L48 16 C48 30 38 46 32 52 C26 46 16 30 16 16 Z" fill="url(#shieldGrad)" filter="url(#glow)" />
    
    <!-- Shield Inner Contrast -->
    <path d="M32 12 L45 18 C45 30 36 43 32 48 C28 43 19 30 19 18 Z" fill="#0e1526" opacity="0.85" />
    
    <!-- Padlock Body -->
    <rect x="25" y="27" width="14" height="11" rx="2.5" fill="url(#lockGrad)" />
    
    <!-- Padlock Shackle -->
    <path d="M28 27 V23 C28 20.8 29.8 19 32 19 C34.2 19 36 20.8 36 23 V27" fill="none" stroke="url(#lockGrad)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Keyhole -->
    <circle cx="32" cy="31.5" r="1.5" fill="#070b14" />
    <path d="M31.2 32.5 L32.8 32.5 L33 35 L31 35 Z" fill="#070b14" />
</svg>
